# Dev profile: port and datasource come from application.yml
# (server.port 8000, DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD env overrides).
app:
  dev-bypass:
    enabled: true

spring:
  jpa:
    show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.karmaos: DEBUG
    org.springframework.security: DEBUG
