server:
  port: 8000

spring:
  profiles:
    default: dev
  application:
    name: karma-os-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:karma_os}
    username: ${DB_USER:karma_os}
    password: ${DB_PASSWORD:karma_os_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-not-for-production-use-change-it-to-256bits}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: 604800000
  storage:
    location: ${STORAGE_LOCATION:./data/artifacts}
    max-artifact-size: ${MAX_ARTIFACT_SIZE:104857600}
    temp-location: ${TEMP_LOCATION:./data/temp}
  workspace:
    max-per-user: ${WORKSPACE_MAX_PER_USER:10}
  media:
    visual-only: ${MEDIA_IMAGE_VISUAL_ONLY:true}
    video-remotion-only: ${MEDIA_VIDEO_REMOTION_ONLY:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    max-age: 3600

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.karmaos: DEBUG
  file:
    path: ${LOG_PATH:./logs}
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,flyway
  endpoint:
    health:
      show-details: when-authorized
